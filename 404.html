<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Luxsome Packaging</title>

    <meta
        name="description"
        content="The page you are looking for could not be found. Return to Luxsome Packaging or explore our packaging systems and gallery."
    >

    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/css/base.css">

    <style>
        body {
            margin: 0;
            background: #f8f4ef;
            color: #2f211b;
            font-family: Arial, sans-serif;
        }

        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .error-page__content {
            width: min(100%, 720px);
        }

        .error-page__code {
            margin: 0 0 16px;
            color: #673629;
            font-size: clamp(5rem, 18vw, 11rem);
            font-weight: 600;
            line-height: 0.85;
            letter-spacing: -0.06em;
        }

        .error-page__eyebrow {
            margin: 0 0 18px;
            color: #673629;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .error-page h1 {
            margin: 0;
            font-size: clamp(2.3rem, 6vw, 4.5rem);
            font-weight: 400;
            line-height: 1.05;
        }

        .error-page__text {
            max-width: 560px;
            margin: 24px auto 0;
            color: #716660;
            font-size: 1rem;
            line-height: 1.8;
        }

        .error-page__actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 34px;
        }

        .error-page__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 26px;
            border: 1px solid #673629;
            text-decoration: none;
            transition:
                background-color 250ms ease,
                color 250ms ease,
                transform 250ms ease;
        }

        .error-page__button--primary {
            background: #673629;
            color: #fffaf6;
        }

        .error-page__button--secondary {
            background: transparent;
            color: #673629;
        }

        .error-page__button:hover {
            transform: translateY(-2px);
        }

        .error-page__button--primary:hover {
            background: #2f211b;
            border-color: #2f211b;
        }

        .error-page__button--secondary:hover {
            background: #673629;
            color: #fffaf6;
        }

        @media (max-width: 520px) {
            .error-page__actions {
                flex-direction: column;
            }

            .error-page__button {
                width: 100%;
                box-sizing: border-box;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-page__button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="error-page">
        <div class="error-page__content">
            <p class="error-page__code" aria-hidden="true">404</p>

            <p class="error-page__eyebrow">
                Page not found
            </p>

            <h1>
                This page is no longer part of the collection.
            </h1>

            <p class="error-page__text">
                The address may have changed, or the page may no longer exist.
                Return to the homepage or continue exploring the Luxsome collection.
            </p>

            <div class="error-page__actions">
                <a
                    href="/"
                    class="error-page__button error-page__button--primary"
                >
                    Return Home
                </a>

                <a
                    href="/gallery/"
                    class="error-page__button error-page__button--secondary"
                >
                    View Gallery
                </a>
            </div>
        </div>
    </main>
</body>
</html>
