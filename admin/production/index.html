<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Production Schedule | Luxsome CRM</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/admin-v2.css">
    <link rel="stylesheet" href="/css/crm-responsive.css">
    <link rel="stylesheet" href="/css/production-v1.css?v=2">
</head>


<body class="crm-app-page">

    <div class="crm-app">

        <aside
            class="crm-sidebar"
            id="crmSidebar"
        >
            <div>
                <div data-luxsome-crm-logo></div>

                <nav
                    class="crm-nav"
                    aria-label="CRM navigation"
                >
                    <section class="crm-nav__group">
                        <p class="crm-nav__label">
                            Overview
                        </p>

                        <a
                            class="crm-nav__item crm-nav__item--link"
                            href="/admin/"
                        >
                            <span>Dashboard</span>
                            <small>→</small>
                        </a>
                    </section>

                    <section class="crm-nav__group">
                        <p class="crm-nav__label">
                            Sales
                        </p>

                        <a
                            class="crm-nav__item crm-nav__item--link"
                            href="/admin/"
                        >
                            <span>Enquiries</span>
                            <small>→</small>
                        </a>

                        <a
                            class="crm-nav__item crm-nav__item--link"
                            href="/admin/invoices/"
                        >
                            <span>Invoices</span>
                            <small>→</small>
                        </a>
                    </section>

                    <section class="crm-nav__group">
                        <p class="crm-nav__label">
                            Fulfilment
                        </p>

                        <a
                            class="crm-nav__item crm-nav__item--link"
                            href="/admin/orders/"
                        >
                            <span>Orders</span>
                            <small>→</small>
                        </a>

                        <a
                            class="crm-nav__item crm-nav__item--link is-active"
                            href="/admin/production/"
                        >
                            <span>Production</span>
                            <small>●</small>
                        </a>
                    </section>
                </nav>
            </div>

            <div class="crm-sidebar__footer">
                <button
                    id="logout"
                    class="crm-sidebar__logout"
                    type="button"
                >
                    Lock dashboard
                </button>
            </div>
        </aside>


        <div class="crm-main">

            <header class="crm-topbar production-header">

                <button
                    id="mobileMenuButton"
                    class="crm-mobile-menu"
                    type="button"
                    aria-controls="crmSidebar"
                    aria-expanded="false"
                >
                    Menu
                </button>

                <div>
                    <p class="crm-eyebrow">
                        PRODUCTION CONTROL
                    </p>

                    <h1>
                        Production Schedule
                    </h1>

                    <span>
                        Plan and track every active packaging project.
                    </span>
                </div>

                <div class="crm-topbar__actions header-actions">

                    <button
                        id="todayButton"
                        class="crm-button crm-button--secondary"
                        type="button"
                    >
                        Today
                    </button>

                    <button
                        id="refreshButton"
                        class="crm-button crm-button--primary"
                        type="button"
                    >
                        Refresh
                    </button>

                </div>

            </header>
        </div>
    </div>

    <script src="/js/production-v1.js"></script>
    <script src="/js/crm-brand.js"></script>
</body>
</html>
